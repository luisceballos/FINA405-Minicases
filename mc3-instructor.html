<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC3 group reports</title><link rel="stylesheet" href="minicase3.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="mc3-roster405.js"></script></head><body><header><div class="header-inner"><h1>MC3 · Group reports · Section 01</h1><a class="back" href="minicase-hub.html">← Hub</a></div></header><main><section class="card"><h2>Group submission settings</h2><p>The 40-student PDF roster is included in mc3-roster405.js. No roster import is required. Groups select up to five names and submit one shared report.</p><label for="password">Existing FINA405 instructor password</label><input id="password" type="password" autocomplete="current-password"><button id="login">Open instructor controls</button><p id="status" role="status"></p><div id="controls" hidden><label><input id="active" type="checkbox"> MC3 open to students</label><button id="save">Save availability</button><h2>Read a group report</h2><label for="student">Group</label><select id="student"></select><button id="read">Load report</button><button id="download" disabled>Download report</button><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div><p><a href="minicase3.html?preview=1">Practice preview</a></p></section></main><script>
'use strict';
const $=id=>document.getElementById(id);let cfg,report;
firebase.initializeApp({apiKey:'AIzaSyAjHL3MztreUN7J7QKW3q_nRbiNoxLwA0E',authDomain:'fina402-60e86.firebaseapp.com',projectId:'fina402-60e86',storageBucket:'fina402-60e86.firebasestorage.app',messagingSenderId:'1058911893067',appId:'1:1058911893067:web:0ab85f8a600d4fb8d2ffce'});
const db=firebase.firestore(),ref=db.doc('minicase_hub405/config');let authorized=false;
for(let g=1;g<=40;g++)$('student').append(new Option('Group '+g,g));
$('login').onclick=async()=>{try{cfg=(await ref.get()).data();if(!cfg?.password||$('password').value!==cfg.password)throw Error('Incorrect password.');authorized=true;$('password').value='';$('controls').hidden=false;$('active').checked=!!cfg.minicases?.[2]?.active;$('status').textContent='40 students · group reports';}catch(e){$('status').textContent=e.message;}};
$('save').onclick=async()=>{if(!authorized)return;try{await db.runTransaction(async tx=>{const s=await tx.get(ref),c=s.data();if(c.password!==cfg.password)throw Error('Please sign in again.');const cases=c.minicases||[];while(cases.length<3)cases.push({active:false});cases[2]={...cases[2],title:"Amazon's Financing Decision",description:'60 minutes · Group submission · Collaboration welcome',submissionMode:'group',active:$('active').checked,sections:[{name:'Section 1',active:true,groups:8}]};tx.update(ref,{minicases:cases});});$('status').textContent='Availability saved for group submissions.';}catch(e){$('status').textContent=e.message;}};
$('read').onclick=async()=>{if(!authorized)return;report=null;$('download').disabled=true;try{const s=await db.doc('mc405_submissions/mc3_v4_sec1_grp'+$('student').value).get();report=s.data();$('report').textContent=s.exists?JSON.stringify(report,null,2):'No group submission yet.';$('download').disabled=!s.exists;}catch(e){$('status').textContent=e.message;}};
$('download').onclick=()=>{if(!report)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='MC3-'+report.group+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script></body></html>
